stage1:
  use_patches: true
  patch_size: 128
  halo_radius: 12
  full_frame_fallback: true

model:
  base_channels: 16
  levels: 4
  normalization: batch
  dropout: 0.0

diffusion:
  num_train_timesteps: 1000
  sampler: ddim
  num_inference_steps: 50
  residual_loss_weight: 0.0

training:
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  warmup_epochs: 5
  weight_decay: 0.001
  batch_size: 16
  num_workers: 8

