stage1:
  use_patches: true
  patch_size: 128
  halo_radius: 12
  full_frame_fallback: true

model:
  base_channels: 16
  levels: 4
  normalization: batch
  dropout: 0.0

loss:
  feature_loss_mode: smooth_l1
  feature_loss_weight: 1.0
  occupancy_loss_weight: 0.0
  offset_loss_weight: 0.0

training:
  learning_rate: 0.0002
  min_learning_rate: 0.000001
  warmup_epochs: 5
  weight_decay: 0.001
  batch_size: 32
  num_workers: 8

