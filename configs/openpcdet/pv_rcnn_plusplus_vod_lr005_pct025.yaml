# Controlled lower-learning-rate ablation of the clean VoD PV-RCNN++ detector.
# Architecture, dataset, augmentation, loss, and regularization match the baseline;
# only LR and the one-cycle peak position differ.
_BASE_CONFIG_: '../../../configs/openpcdet/pv_rcnn_plusplus_vod.yaml'

OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 2
    NUM_EPOCHS: 80
    OPTIMIZER: adam_onecycle
    LR: 0.005
    WEIGHT_DECAY: 0.001
    MOMENTUM: 0.9
    MOMS: [0.95, 0.85]
    PCT_START: 0.25
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [60, 72]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001
    LR_WARMUP: False
    WARMUP_EPOCH: 1
    GRAD_NORM_CLIP: 10
